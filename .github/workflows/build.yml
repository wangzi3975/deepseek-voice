name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev gettext libltdl-dev

      # Cython 3.0.x 才能配 Kivy 2.3.x（0.29.x 会编译失败）
      - name: Setup Buildozer and Cython
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "cython==3.0.11" buildozer

      - name: Clean conflicting Android env vars
        run: |
          echo "ANDROID_HOME=" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=" >> $GITHUB_ENV

      - name: Pre-install Android SDK cmdline-tools
        run: |
          set -e
          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          cd /tmp
          curl -sSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip -d /tmp/cmdtools
          rm -rf "$SDK_ROOT/cmdline-tools/latest"
          mv /tmp/cmdtools/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
          mkdir -p "$SDK_ROOT/tools/bin"
          ln -sf "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$SDK_ROOT/tools/bin/sdkmanager"
          ln -sf "$SDK_ROOT/cmdline-tools/latest/bin/avdmanager" "$SDK_ROOT/tools/bin/avdmanager"
          chmod +x "$SDK_ROOT/cmdline-tools/latest/bin/"* || true
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          echo "✅ cmdline-tools 就位"

      # 生成发布签名证书（release 签名包在华为等设备上不会被安全机制拦截；
      # debug 包带 android:debuggable=true，部分国产系统会直接拒绝启动）
      - name: Generate release keystore + export signing env
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.keystore" \
            -alias deepseek -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass deepseek2024 -keypass deepseek2024 \
            -dname "CN=DeepSeekVoice, OU=Dev, O=Personal, L=City, ST=State, C=CN"
          echo "P4A_RELEASE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> $GITHUB_ENV
          echo "P4A_RELEASE_KEYSTORE_PASSWD=deepseek2024" >> $GITHUB_ENV
          echo "P4A_RELEASE_KEYALIAS=deepseek" >> $GITHUB_ENV
          echo "P4A_RELEASE_KEYALIAS_PASSWD=deepseek2024" >> $GITHUB_ENV
          echo "✅ 签名环境变量已导出"

      - name: Clean buildozer and p4a caches
        run: |
          buildozer android clean || true
          rm -rf .buildozer/android/platform/python-for-android
          rm -rf .buildozer/android/platform/build-* || true
          echo "✅ 缓存已清理"

      # 注意：不要用 `yes |`，否则 yes 被 SIGPIPE 杀掉会让整个命令返回非零退出码，
      # 导致 APK 已生成却被判为失败、跳过上传步骤。
      # release 模式 + 显式指定产物为 apk（android.release_artifact=apk，见 buildozer.spec），
      # 这样得到的是"已签名、非 debuggable"的正式包，可避开国产系统的 debug 包拦截。
      - name: Build signed release APK
        run: |
          buildozer -v android release > build_full.log 2>&1 || true
          echo "构建命令返回，检查产物..."
          ls -la bin/ || true
          if ls bin/*.apk >/dev/null 2>&1; then
            echo "✅ 已签名 release APK 生成"
          else
            echo "⚠️ release 未产出 apk，回退 debug 构建"
            buildozer -v android debug >> build_full.log 2>&1 || true
            ls -la bin/ || true
          fi
          if ls bin/*.apk >/dev/null 2>&1; then
            echo "✅ APK 已生成"
          else
            echo "❌ 未找到 APK"; exit 1
          fi

      - name: Verify APK signing and permissions
        if: always()
        run: |
          APK=$(ls bin/*.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then echo "无 APK"; exit 0; fi
          echo "=== 产物: $APK ==="
          BT=$(ls -d $HOME/.buildozer/android/platform/android-sdk/build-tools/* 2>/dev/null | head -1)
          echo "build-tools: $BT"
          if [ -n "$BT" ]; then
            echo "--- 签名信息 ---"
            "$BT/aapt" dump badging "$APK" 2>/dev/null | grep -iE "package|sdkVersion|uses-permission|application-debuggable" || true
          fi
          echo "--- 是否可调试(debuggable) ---"
          unzip -p "$APK" AndroidManifest.xml 2>/dev/null | strings | grep -i debuggable || echo "(未检出)"
          echo "--- 文件大小 ---"
          stat -c "%n %s bytes" "$APK"

      - name: Show build log tail if failed
        if: failure()
        run: |
          echo "===== 构建日志最后 200 行 ====="
          tail -200 build_full.log || true

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_full.log
          if-no-files-found: warn

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-voice-apk
          path: bin/*.apk
          if-no-files-found: error
