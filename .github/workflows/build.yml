name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # 统一 JDK 17，并清掉 runner 自带的其它 JDK，避免 buildozer 抓到 JDK 11
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev gettext libltdl-dev

      - name: Setup Buildozer and Cython
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "cython==0.29.36" buildozer

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}-v3

      # ★ 关键修复：预先装好 Android cmdline-tools，并在两个老/新路径都建立 sdkmanager
      #   Buildozer 会去 tools/bin/sdkmanager 找，而新版 SDK 放在 cmdline-tools/latest/bin
      - name: Pre-install Android SDK cmdline-tools
        run: |
          set -e
          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          cd /tmp
          echo "下载 Android cmdline-tools..."
          curl -sSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip -d /tmp/cmdtools
          rm -rf "$SDK_ROOT/cmdline-tools/latest"
          mv /tmp/cmdtools/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
          # 在老路径建立兼容软链接，让 buildozer 能找到
          mkdir -p "$SDK_ROOT/tools/bin"
          ln -sf "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$SDK_ROOT/tools/bin/sdkmanager"
          ln -sf "$SDK_ROOT/cmdline-tools/latest/bin/avdmanager" "$SDK_ROOT/tools/bin/avdmanager"
          chmod +x "$SDK_ROOT/cmdline-tools/latest/bin/"* || true
          echo "sdkmanager 已就位:"
          ls -la "$SDK_ROOT/tools/bin/sdkmanager"
          # 预接受许可
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          echo "许可协议已接受"

      - name: Build APK
        run: |
          yes | buildozer -v android debug 2>&1 | tail -100

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-voice-apk
          path: bin/*.apk
          if-no-files-found: error
